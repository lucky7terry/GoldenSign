version: 1
disable_existing_loggers: false
formatters:
  extra:
    (): devlog.ExtraFormatter
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
    datefmt: "%H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    formatter: extra
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]
loggers:
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: false
