name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check server Python syntax
        run: |
          if [ -d "server" ]; then
            python -m compileall server
          else
            echo "server/ not found. skipped."
          fi

      - name: Validate contracts JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contracts_dir = Path("contracts")

          if not contracts_dir.exists():
              print("contracts/ not found. skipped.")
              raise SystemExit(0)

          json_files = list(contracts_dir.rglob("*.json"))

          if not json_files:
              print("No JSON files in contracts/. skipped.")
              raise SystemExit(0)

          for file in json_files:
              with file.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"valid json: {file}")

          print("contracts JSON validation passed.")
          PY

      # mentra/ 를 대상으로 하던 Node 스텝 두 개("Set up Node.js" / "Check Mentra
      # MiniApp build") 는 여기서 뺐다. mentra/package.json 에 build 스크립트가
      # 없어서 `npm run build --if-present` 가 아무것도 검증하지 않고 통과했고,
      # mentra/ 는 bun 프로젝트(bun.lock, bunfig.toml)라 npm install 이 lockfile 도
      # 무시했다. 디렉터리는 그대로 있고 CI 대상에서만 빠진 것이다.
      - name: Set up Bun
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        uses: oven-sh/setup-bun@v2

      - name: Check MiniApp
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        working-directory: miniapp
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
