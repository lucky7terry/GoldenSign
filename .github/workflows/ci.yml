name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-test.txt

      - name: Install server test dependencies
        working-directory: server
        run: pip install -r requirements-test.txt

      - name: Check server Python syntax
        run: python -m compileall server

      - name: Run server tests
        working-directory: server
        run: python -m unittest discover -s tests -v

      - name: Validate fixture JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # 계약 예시는 contracts/ 가 아니라 fixtures/ 에 있다.
          # 없으면 조용히 넘어가지 않고 실패시킨다.
          fixtures_dir = Path("fixtures")
          json_files = sorted(fixtures_dir.rglob("*.json"))

          if not json_files:
              raise SystemExit("fixtures/ 에 JSON 파일이 없습니다.")

          for file in json_files:
              with file.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"valid json: {file}")

          print("fixture JSON validation passed.")
          PY

      - name: Set up Bun
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        uses: oven-sh/setup-bun@v2

      - name: Check MiniApp
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        working-directory: miniapp
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
